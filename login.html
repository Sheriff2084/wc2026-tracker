<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allegro WC2026 — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --green:#0a6640;--green-mid:#0d8a56;--green-light:#1db87a;
    --gold:#f5c518;--gold-dark:#d4a800;
    --dark:#0a0f14;--darker:#060a0e;--mid:#141e28;--card:#1a2535;
    --border:rgba(245,197,24,0.2);--white:#f0f4f8;--muted:#8899aa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--darker);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 40px,rgba(255,255,255,0.015) 40px,rgba(255,255,255,0.015) 80px);pointer-events:none}

  .card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 36px;width:100%;max-width:420px;text-align:center}
  .trophy{font-size:48px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(245,197,24,0.5))}
  h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:4px;color:var(--gold);line-height:0.9;margin-bottom:4px}
  h1 span{display:block;font-size:0.45em;letter-spacing:8px;color:var(--white);opacity:0.6}
  .sub{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green-light);margin-bottom:28px}
  .divider{height:1px;background:var(--border);margin:20px 0}

  label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:left;margin-bottom:6px}
  input{display:block;width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:13px 16px;color:var(--white);font-family:'Barlow',sans-serif;font-size:16px;outline:none;transition:border-color 0.2s;margin-bottom:14px}
  input:focus{border-color:var(--gold)}
  input::placeholder{color:var(--muted)}
  input[readonly]{background:rgba(255,255,255,0.02);color:var(--muted);border-color:rgba(255,255,255,0.06);cursor:default}

  .name-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .name-row input{margin-bottom:0}
  .name-row label{margin-bottom:6px}

  .btn{width:100%;background:var(--gold);color:#000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;border:none;border-radius:10px;padding:15px;cursor:pointer;transition:background 0.2s;margin-top:6px}
  .btn:hover{background:var(--gold-dark)}
  .btn:disabled{background:rgba(245,197,24,0.3);color:rgba(0,0,0,0.4);cursor:not-allowed}
  .btn-back{background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;margin-top:14px;display:block;width:100%;text-align:center}
  .btn-back:hover{color:var(--white)}

  .msg{margin-top:16px;padding:12px 16px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:15px;display:none;text-align:left}
  .msg.error{background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.3);color:#ff9090}
  .msg.show{display:block}

  .step{display:none}.step.show{display:block}

  .step-heading{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .step-heading strong{color:var(--gold)}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <span class="trophy">🏆</span>
  <h1><span>Allegro</span>World Cup 2026</h1>
  <p class="sub">Office Pool — 2026</p>
  <div class="divider"></div>

  <!-- Step 1: email -->
  <div class="step show" id="step1">
    <div style="text-align:left;margin-bottom:4px">
      <label>Your Email</label>
      <input type="email" id="emailInput" placeholder="you@allegrofunds.com.au" autocomplete="email">
    </div>
    <button class="btn" id="continueBtn" onclick="checkEmail()">CONTINUE</button>
    <div class="msg error" id="msg1"></div>
  </div>

  <!-- Step 2: register (new user) -->
  <div class="step" id="step2">
    <p class="step-heading">Welcome! You're new here.<br>Enter your name to join the pool.</p>
    <div class="name-row" style="margin-bottom:14px">
      <div>
        <label>First Name</label>
        <input type="text" id="firstInput" placeholder="Mark" autocomplete="given-name">
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" id="lastInput" placeholder="Sheriff" autocomplete="family-name">
      </div>
    </div>
    <div style="text-align:left;margin-bottom:4px">
      <label>Email</label>
      <input type="email" id="emailDisplay" readonly>
    </div>
    <button class="btn" id="registerBtn" onclick="register()">JOIN THE POOL</button>
    <button class="btn-back" onclick="goBack()">← Use a different email</button>
    <div class="msg error" id="msg2"></div>
  </div>
</div>

<script>
function getSession()        { try { return JSON.parse(localStorage.getItem('wc2026_session')); } catch { return null; } }
function setSession(profile) { localStorage.setItem('wc2026_session', JSON.stringify(profile)); }

// If already logged in, skip straight through
(async () => {
  const sess = getSession();
  if (sess) { await redirect(sess); }
})();

async function checkEmail() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  if (!email || !email.includes('@')) { showMsg('msg1', 'Please enter a valid email.'); return; }

  setLoading('continueBtn', true, 'CHECKING...');

  const { data: profile, error } = await db
    .from('profiles')
    .select('*')
    .eq('email', email)
    .maybeSingle();

  setLoading('continueBtn', false, 'CONTINUE');

  if (error) { showMsg('msg1', 'Error: ' + error.message); return; }

  if (profile) {
    // Returning user — log straight in
    setSession(profile);
    await redirect(profile);
  } else {
    // New user — show registration step
    document.getElementById('emailDisplay').value = email;
    document.getElementById('step1').classList.remove('show');
    document.getElementById('step2').classList.add('show');
    document.getElementById('firstInput').focus();
  }
}

async function register() {
  const first = document.getElementById('firstInput').value.trim();
  const last  = document.getElementById('lastInput').value.trim();
  const email = document.getElementById('emailDisplay').value.trim().toLowerCase();

  if (!first) { showMsg('msg2', 'Please enter your first name.'); return; }
  if (!last)  { showMsg('msg2', 'Please enter your last name.');  return; }

  setLoading('registerBtn', true, 'JOINING...');

  const { data: profile, error } = await db
    .from('profiles')
    .insert({ first_name: first, last_name: last, email })
    .select()
    .single();

  setLoading('registerBtn', false, 'JOIN THE POOL');

  if (error) {
    if (error.code === '23505') {
      // Race condition — email was registered between check and insert
      const { data: existing } = await db.from('profiles').select('*').eq('email', email).single();
      if (existing) { setSession(existing); await redirect(existing); return; }
    }
    showMsg('msg2', 'Error: ' + error.message);
    return;
  }

  setSession(profile);
  await redirect(profile);
}

async function redirect(profile) {
  const { data: settings } = await db.from('draw_settings').select('draw_open').single();
  const drawOpen  = settings?.draw_open;
  const hasDraws  = profile.draws_used < profile.draws_allowed;
  if (drawOpen && hasDraws) {
    window.location.href = 'draw.html';
  } else {
    window.location.href = 'index.html';
  }
}

function goBack() {
  document.getElementById('step2').classList.remove('show');
  document.getElementById('step1').classList.add('show');
  document.getElementById('msg2').classList.remove('show');
}

function showMsg(id, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.add('show');
}

function setLoading(btnId, loading, text) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
}

// Allow Enter key on both steps
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('step1').classList.contains('show')) checkEmail();
  else if (document.getElementById('step2').classList.contains('show')) register();
});
</script>
</body>
</html>
