<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allegro World Cup 2026 — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root{
    --green:#0a6640;--green-mid:#0d8a56;--green-light:#1db87a;
    --gold:#f5c518;--gold-dark:#d4a800;
    --darker:#060a0e;--card:#1a2535;--white:#f0f4f8;--muted:#8899aa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:'Barlow',sans-serif;background:var(--darker);color:var(--white)}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 40px,rgba(255,255,255,0.012) 40px,rgba(255,255,255,0.012) 80px);pointer-events:none;z-index:0}

  /* ── Scatter layer ─────────────────────────────────────────────────────── */
  #scatter{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}

  .s-flag{
    position:absolute;
    border-radius:4px;
    box-shadow:0 3px 12px rgba(0,0,0,0.5);
    opacity:0;
    animation:floatIn 0.8s ease forwards, floatLoop var(--dur,6s) ease-in-out var(--delay,0s) infinite;
    transform:rotate(var(--rot,0deg));
  }
  .s-face{
    position:absolute;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 4px 16px rgba(0,0,0,0.6);
    border:3px solid rgba(245,197,24,0.4);
    opacity:0;
    animation:floatIn 0.8s ease forwards, floatLoop var(--dur,6s) ease-in-out var(--delay,0s) infinite;
    transform:rotate(var(--rot,0deg));
  }

  @keyframes floatIn{from{opacity:0;transform:translateY(20px) rotate(var(--rot,0deg))}to{opacity:var(--op,0.75);transform:translateY(0) rotate(var(--rot,0deg))}}
  @keyframes floatLoop{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(var(--rise,-14px)) rotate(calc(var(--rot,0deg) + var(--tilt,2deg)))}}

  /* ── Radial vignette behind centre text ───────────────────────────────── */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 55% 52% at 50% 50%,rgba(6,10,14,0.82) 30%,rgba(6,10,14,0.4) 65%,transparent 100%);
  }

  /* ── Centre content ───────────────────────────────────────────────────── */
  #centre{
    position:fixed;inset:0;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
  }

  .trophy{font-size:clamp(48px,7vw,80px);display:block;margin-bottom:6px;filter:drop-shadow(0 0 20px rgba(245,197,24,0.6));animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 12px rgba(245,197,24,0.4))}50%{filter:drop-shadow(0 0 32px rgba(245,197,24,0.85))}}

  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,9vw,110px);letter-spacing:4px;color:var(--gold);line-height:0.88;margin-bottom:10px}
  h1 span{display:block;font-size:0.58em;letter-spacing:10px;color:#63d4f5}

  .cs-label{font-family:'Barlow Condensed',sans-serif;font-size:clamp(14px,2.5vw,22px);letter-spacing:8px;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:24px}

  /* Countdown */
  .countdown{display:flex;align-items:flex-end;gap:clamp(8px,2vw,20px);margin-bottom:18px}
  .cd-block{text-align:center}
  .cd-n{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,72px);color:var(--gold);line-height:1;display:block}
  .cd-l{font-family:'Barlow Condensed',sans-serif;font-size:clamp(10px,1.5vw,14px);letter-spacing:3px;text-transform:uppercase;color:var(--muted);display:block;margin-top:-2px}
  .cd-sep{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,58px);color:rgba(245,197,24,0.35);padding-bottom:18px}

  .start-date{font-family:'Barlow Condensed',sans-serif;font-size:clamp(13px,1.8vw,17px);letter-spacing:2px;color:var(--muted);margin-bottom:28px}
  .start-date strong{color:var(--white)}

  .join-btn{
    font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,2.5vw,24px);letter-spacing:3px;
    background:var(--gold);color:#000;text-decoration:none;
    padding:clamp(10px,1.5vw,14px) clamp(28px,4vw,52px);
    border-radius:10px;display:inline-block;
    box-shadow:0 4px 24px rgba(245,197,24,0.35);
    transition:all 0.2s
  }
  .join-btn:hover{background:var(--gold-dark);box-shadow:0 6px 32px rgba(245,197,24,0.55);transform:translateY(-2px)}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div id="scatter"></div>
<div id="vignette"></div>

<div id="centre">
  <span class="trophy">🏆</span>
  <h1><span>Allegro</span>World Cup 2026</h1>
  <p class="cs-label">Coming Soon</p>
  <div class="countdown" id="countdown"></div>
  <p class="start-date">First kick-off <strong>Friday 12 June 2026 · 5:00am AEST</strong></p>
</div>

<script>
// ── Flag data ────────────────────────────────────────────────────────────────
const FLAG_CODES = {
  'Mexico':'mx','South Korea':'kr','South Africa':'za','Czechia':'cz',
  'Canada':'ca','Switzerland':'ch','Qatar':'qa','Bosnia & Herz.':'ba',
  'Brazil':'br','Morocco':'ma','Scotland':'https://upload.wikimedia.org/wikipedia/commons/1/10/Flag_of_Scotland.svg','Haiti':'ht',
  'United States':'us','Australia':'au','Paraguay':'py','Türkiye':'tr',
  'Germany':'de','Ivory Coast':'ci','Ecuador':'ec','Curaçao':'cw',
  'Netherlands':'nl','Japan':'jp','Sweden':'se','Tunisia':'tn',
  'Belgium':'be','Egypt':'eg','Iran':'ir','New Zealand':'nz',
  'Spain':'es','Cape Verde':'cv','Saudi Arabia':'sa','Uruguay':'uy',
  'France':'fr','Senegal':'sn','Iraq':'iq','Norway':'no',
  'Argentina':'ar','Algeria':'dz','Austria':'at','Jordan':'jo',
  'Portugal':'pt','DR Congo':'cd','Uzbekistan':'uz','Colombia':'co',
  'England':'https://upload.wikimedia.org/wikipedia/en/b/be/Flag_of_England.svg',
  'Croatia':'hr','Ghana':'gh','Panama':'pa',
};

const flagUrl = val => val.startsWith('http') ? val : `https://flagcdn.com/w80/${val}.png`;
const ALL_FLAGS = Object.entries(FLAG_CODES).map(([name, val]) => ({ name, url: flagUrl(val) }));

// ── Countdown ────────────────────────────────────────────────────────────────
function tick() {
  const target = new Date('2026-06-12T05:00:00+10:00');
  const diff   = target - new Date();
  if (diff <= 0) {
    document.getElementById('countdown').innerHTML = `<div class="cs-label" style="font-size:clamp(16px,3vw,28px);color:var(--gold)">The Tournament Is Here!</div>`;
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000)  / 60000);
  const s = Math.floor((diff % 60000)    / 1000);
  const block = (n, l) => `<div class="cd-block"><span class="cd-n">${String(n).padStart(2,'0')}</span><span class="cd-l">${l}</span></div>`;
  document.getElementById('countdown').innerHTML =
    block(d,'Days') + '<span class="cd-sep">:</span>' +
    block(h,'Hrs')  + '<span class="cd-sep">:</span>' +
    block(m,'Mins') + '<span class="cd-sep">:</span>' +
    block(s,'Secs');
}
tick(); setInterval(tick, 1000);

// ── Scatter ───────────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function randPick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }

function placeItem(el, sizeW, sizeH) {
  const vw = window.innerWidth, vh = window.innerHeight;
  // Safe zone: avoid the centre 46% × 54%
  const czL = vw * 0.27, czR = vw * 0.73;
  const czT = vh * 0.23, czB = vh * 0.77;

  let x, y, attempts = 0;
  do {
    x = rnd(0, vw - sizeW);
    y = rnd(0, vh - sizeH);
    attempts++;
  } while (
    attempts < 40 &&
    x + sizeW > czL && x < czR &&
    y + sizeH > czT && y < czB
  );

  el.style.left = x + 'px';
  el.style.top  = y + 'px';
}

function scatterFlags() {
  const scatter = document.getElementById('scatter');
  ALL_FLAGS.forEach((flag, i) => {
    const size = Math.round(rnd(42, 72));
    const img  = document.createElement('img');
    img.src    = flag.url;
    img.alt    = flag.name;
    img.className = 's-flag';
    img.width  = size;
    img.style.setProperty('--rot',   rnd(-14, 14) + 'deg');
    img.style.setProperty('--dur',   rnd(5, 9) + 's');
    img.style.setProperty('--delay', rnd(0, 5) + 's');
    img.style.setProperty('--rise',  '-' + rnd(8, 18) + 'px');
    img.style.setProperty('--tilt',  (Math.random() > 0.5 ? '' : '-') + rnd(1, 4) + 'deg');
    img.style.setProperty('--op',    rnd(0.55, 0.82).toFixed(2));
    placeItem(img, size, Math.round(size * 0.67));
    scatter.appendChild(img);
  });
}

async function scatterFaces() {
  let avatars = [];
  try {
    const { data } = await db.from('profiles').select('avatar_url, first_name').not('avatar_url', 'is', null);
    avatars = (data || []).filter(p => p.avatar_url);
  } catch(e) { return; }

  const scatter = document.getElementById('scatter');
  avatars.forEach(person => {
    const size = Math.round(rnd(55, 85));
    const img  = document.createElement('img');
    img.src    = person.avatar_url;
    img.alt    = person.first_name || '';
    img.className = 's-face';
    img.width  = size;
    img.height = size;
    img.style.setProperty('--rot',   rnd(-8, 8) + 'deg');
    img.style.setProperty('--dur',   rnd(6, 10) + 's');
    img.style.setProperty('--delay', rnd(0, 6) + 's');
    img.style.setProperty('--rise',  '-' + rnd(10, 20) + 'px');
    img.style.setProperty('--tilt',  (Math.random() > 0.5 ? '' : '-') + rnd(1, 3) + 'deg');
    img.style.setProperty('--op',    rnd(0.7, 0.95).toFixed(2));
    placeItem(img, size, size);
    scatter.appendChild(img);
  });
}

scatterFlags();
scatterFaces();

// Re-scatter on resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll('.s-flag,.s-face').forEach(el => placeItem(el, el.offsetWidth, el.offsetHeight));
  }, 200);
});
</script>
</body>
</html>
