<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allegro World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --green:#0a6640;--green-mid:#0d8a56;--green-light:#1db87a;
    --gold:#f5c518;--gold-dark:#d4a800;
    --dark:#0a0f14;--darker:#060a0e;--mid:#141e28;--card:#1a2535;
    --border:rgba(245,197,24,0.2);--white:#f0f4f8;--muted:#8899aa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--darker);color:var(--white);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 40px,rgba(255,255,255,0.015) 40px,rgba(255,255,255,0.015) 80px);pointer-events:none;z-index:0}

  .hdr{position:relative;background:linear-gradient(135deg,#0a1520 0%,#0e2d1a 40%,#0a6640 100%);border-bottom:3px solid var(--gold);padding:28px 24px 20px;text-align:center;overflow:hidden;z-index:1}
  .hdr::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,0.08),transparent 70%);pointer-events:none}
  .hdr-nav{position:absolute;top:16px;right:18px;display:flex;gap:10px;align-items:center}
  .btn-sm{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 14px;border-radius:7px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block}
  .btn-sm:hover{color:var(--white);border-color:rgba(255,255,255,0.35)}
  .btn-sm.gold{border-color:var(--gold);color:var(--gold)}
  .btn-sm.gold:hover{background:rgba(245,197,24,0.1)}
  .trophy-ico{font-size:44px;display:block;margin-bottom:4px;filter:drop-shadow(0 0 16px rgba(245,197,24,0.5));animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(245,197,24,0.4))}50%{filter:drop-shadow(0 0 26px rgba(245,197,24,0.8))}}
  .hdr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,62px);letter-spacing:4px;color:var(--gold);line-height:0.9}
  .hdr h1 span{display:block;font-size:0.62em;letter-spacing:10px;color:#63d4f5;opacity:1}
  .hdr-sub{margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--green-light)}
  .last-updated{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-top:4px}

  .tabs{position:relative;z-index:1;display:flex;background:var(--mid);border-bottom:2px solid var(--border);overflow-x:auto}
  .tab{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;background:transparent;color:var(--muted);padding:15px 22px;cursor:pointer;transition:all 0.2s;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex-shrink:0}
  .tab:hover{color:var(--white)}.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .pane{display:none}.pane.on{display:block}

  .container{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:22px 18px}

  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:10px}
  .leg{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted)}
  .leg-bar{width:5px;height:22px;border-radius:3px;flex-shrink:0}

  .status-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .stat{text-align:center}
  .stat-n{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);line-height:1}
  .stat-l{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .stat-div{width:1px;height:32px;background:var(--border)}

  .group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-bottom:24px}
  .group-card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden}
  .group-hd{background:linear-gradient(90deg,var(--green),var(--green-mid));padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
  .group-lbl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px}
  .group-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:rgba(255,255,255,0.65);letter-spacing:1px}
  .group-teams{padding:6px 0}
  .team-row{display:flex;align-items:center;gap:0;padding:9px 16px;border-left:4px solid transparent}
  .team-row.t1{border-left-color:var(--gold)}.team-row.t2{border-left-color:#c0c0c0}.team-row.t3{border-left-color:#cd7f32}.team-row.t4{border-left-color:rgba(255,255,255,0.1)}
  .team-info{flex:1;min-width:0}
  .team-name{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.3px}
  .team-owner{font-size:13px;color:var(--gold);font-family:'Barlow Condensed',sans-serif;margin-top:1px}
  .team-pts{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--white);min-width:36px;text-align:center;line-height:1}
  .team-gd-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-align:center}

  .match-group-block{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .match-group-hd{background:linear-gradient(90deg,var(--mid),rgba(20,30,40,0.4));padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
  .mgh-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold)}
  .mgh-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);letter-spacing:1px}
  .match-group-body{padding:12px 16px}
  .match-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);margin-bottom:8px}
  .match-row.played{border-color:rgba(255,255,255,0.09)}
  .mt{display:flex;align-items:center;gap:8px;flex:1}
  .mt.right{flex-direction:row-reverse;text-align:right}
  .mn{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;line-height:1.2}
  .mo{font-size:12px;color:var(--gold);font-family:'Barlow Condensed';margin-top:1px}
  .score-display{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:80px;justify-content:center}
  .score-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--white);min-width:28px;text-align:center;line-height:1}
  .score-val.winner{color:var(--green-light)}
  .score-dash{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted)}
  .score-tbd{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:rgba(255,255,255,0.2);letter-spacing:1px}

  .prize-bar{display:flex;align-items:stretch;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .prize-card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px 20px;display:flex;flex-direction:column;gap:2px;min-width:110px}
  .prize-card.p1{border-color:rgba(245,197,24,0.45);background:linear-gradient(135deg,rgba(245,197,24,0.12),rgba(245,197,24,0.04))}
  .prize-card.p2{border-color:rgba(192,192,192,0.35);background:linear-gradient(135deg,rgba(192,192,192,0.08),rgba(192,192,192,0.02))}
  .prize-card.p3{border-color:rgba(205,127,50,0.35);background:linear-gradient(135deg,rgba(205,127,50,0.08),rgba(205,127,50,0.02))}
  .prize-pos{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .prize-pos.p1{color:var(--gold)}.prize-pos.p2{color:#c0c0c0}.prize-pos.p3{color:#cd7f32}
  .prize-amt{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1}
  .prize-amt.p1{color:var(--gold)}.prize-amt.p2{color:#c0c0c0}.prize-amt.p3{color:#cd7f32}.prize-amt.p4{color:var(--white)}

  .bracket-scroll{overflow-x:auto;padding-bottom:24px}
  .bracket-layout{display:inline-flex;align-items:stretch;gap:0;min-width:max-content}
  .b-col{display:flex;flex-direction:column;width:180px;flex-shrink:0;padding:0 5px}
  .b-col-hd{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold);text-align:center;padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .b-col-hd .rd{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .b-matches{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
  .match-block{display:flex;flex-direction:column;gap:3px;padding:2px 0}
  .mpill{display:flex;align-items:center;background:var(--card);border:1px solid rgba(255,255,255,0.09);border-radius:8px;padding:8px 11px;min-height:48px;position:relative;overflow:hidden}
  .mpill.winner{background:linear-gradient(90deg,rgba(10,102,64,0.45),rgba(13,138,86,0.18));border-color:var(--green-light)}
  .mpill.winner::after{content:'✓';position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--green-light);font-weight:bold}
  .mpill.elim{opacity:0.22;text-decoration:line-through}
  .mpill.tbd{opacity:0.4;border-style:dashed}
  .mpill .mname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .mpill .mowner{font-size:11px;color:var(--gold);opacity:0.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-top:2px}
  .mpill.tbd .mname{color:var(--muted);font-style:italic;font-size:13px}
  .match-id-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:1px;text-align:right;padding:0 2px 1px;text-transform:uppercase}
  .mvs{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;color:rgba(255,255,255,0.15);letter-spacing:1px;padding:1px 0}
  .b-gap{width:12px;flex-shrink:0}
  .b-center{display:flex;flex-direction:column;align-items:center;justify-content:center;width:220px;flex-shrink:0;padding:0 14px;gap:14px}
  .fin-lbl{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold);text-align:center}
  .fin-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:-8px}
  .fin-pill{display:flex;align-items:center;background:rgba(245,197,24,0.07);border:1px solid rgba(245,197,24,0.35);border-radius:10px;padding:12px 18px;width:100%;min-height:60px}
  .fin-pill.tbd{opacity:0.35;border-style:dashed}
  .fin-pill.champion{background:linear-gradient(135deg,rgba(245,197,24,0.25),rgba(245,197,24,0.07));border-color:var(--gold);border-width:2px}
  .fin-pill .fname{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;color:var(--gold);line-height:1.1}
  .fin-pill .fowner{font-size:12px;color:rgba(245,197,24,0.75);font-family:'Barlow Condensed';letter-spacing:0.5px;margin-top:2px}
  .fin-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:rgba(255,255,255,0.1)}
  .champ-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:center}

  .lb-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .lb-col{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden}
  .lb-col-hd{padding:13px 18px;display:flex;justify-content:space-between;align-items:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
  .lb-col-hd.alive-hd{background:linear-gradient(90deg,rgba(10,102,64,0.5),rgba(13,138,86,0.2));color:var(--green-light);border-bottom:1px solid rgba(29,184,122,0.3)}
  .lb-col-hd.dead-hd{background:linear-gradient(90deg,rgba(255,60,60,0.18),rgba(255,60,60,0.05));color:#ff9090;border-bottom:1px solid rgba(255,80,80,0.2)}
  .lb-count{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;opacity:0.8;text-transform:uppercase}
  .status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,0.04)}
  .status-row:last-child{border-bottom:none}
  .sr-team{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.3px}
  .status-row.dead .sr-team{text-decoration:line-through;text-decoration-color:rgba(255,120,120,0.5)}
  .sr-person{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--gold);margin-top:1px}
  .sr-status{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;text-align:right;white-space:nowrap}
  .sr-status.in{color:var(--green-light)}.sr-status.out{color:#ff9090}
  .lb-empty{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);text-align:center;padding:24px;font-style:italic}

  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-light);margin-right:6px;animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

  @media(max-width:700px){.group-grid{grid-template-columns:1fr}.lb-two-col{grid-template-columns:1fr}}
  @media(max-width:768px){.qr-panel{display:none!important}}

  /* ── FIFA-style results ─────────────────────────────────────────────────── */
  .res-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.07)}
  .res-pill{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.12);background:transparent;color:var(--muted);padding:8px 18px;border-radius:20px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
  .res-pill:hover{color:var(--white);border-color:rgba(255,255,255,0.3)}
  .res-pill.on{background:var(--gold);border-color:var(--gold);color:#000}
  .res-sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .res-stab{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--muted);padding:6px 13px;border-radius:6px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
  .res-stab:hover{color:var(--white)}.res-stab.on{background:var(--green);border-color:var(--green-mid);color:#fff}
  .res-block{margin-bottom:30px}
  .res-block-hd{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:baseline;gap:10px}
  .res-block-sub{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);letter-spacing:0;font-weight:400}

  .fx-card{display:grid;grid-template-columns:1fr 108px 1fr;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px 18px;margin-bottom:8px;transition:border-color 0.2s}
  .fx-card:hover{border-color:rgba(255,255,255,0.16)}
  .fx-card.played{border-color:rgba(255,255,255,0.1)}
  .fx-team{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
  .fx-flag-img{width:52px;height:auto;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,0.45);display:block;margin:0 auto}
  .fx-flag-blank{width:52px;height:35px;display:block;margin:0 auto;background:rgba(255,255,255,0.04);border-radius:3px;border:1px dashed rgba(255,255,255,0.1)}
  .fx-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:0.3px;line-height:1.2}
  .fx-name.win{color:var(--green-light)}
  .fx-name.tbd{color:var(--muted);font-style:italic;font-size:14px}
  .fx-owner{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--gold)}
  .fx-mid{text-align:center}
  .fx-scores{display:flex;align-items:center;justify-content:center;gap:3px}
  .fx-s{font-family:'Bebas Neue',sans-serif;font-size:50px;color:var(--white);line-height:1;min-width:32px;text-align:center}
  .fx-s.win{color:var(--green-light)}
  .fx-sep{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--muted);padding:0 2px}
  .fx-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:rgba(255,255,255,0.1)}
  .fx-status{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .fx-datetime{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:var(--muted);margin-top:4px;white-space:nowrap}
  .fx-sched-dt{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--white);letter-spacing:0.5px;line-height:1.3}
  .fx-sched-venue{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);margin-top:3px;letter-spacing:0.3px;line-height:1.3}

  /* ── Teams tab ─────────────────────────────────────────────────────────── */
  .t-search{background:var(--card);border:1px solid rgba(255,255,255,0.1);border-radius:9px;padding:10px 16px;color:var(--white);font-family:'Barlow',sans-serif;font-size:15px;outline:none;width:210px;transition:border-color 0.2s}
  .t-search:focus{border-color:var(--gold)}.t-search::placeholder{color:var(--muted)}
  .t-pill{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.12);background:transparent;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
  .t-pill:hover{color:var(--white);border-color:rgba(255,255,255,0.3)}.t-pill.on{background:var(--gold);border-color:var(--gold);color:#000}
  .t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:13px}
  .t-card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;border-top:4px solid var(--tc,rgba(255,255,255,0.15));display:flex;flex-direction:column}
  .t-card.t1{--tc:var(--gold)}.t-card.t2{--tc:#c0c0c0}.t-card.t3{--tc:#cd7f32}.t-card.t4{--tc:rgba(255,255,255,0.2)}
  .t-main{display:flex;gap:12px;padding:14px 16px;align-items:center}
  .t-flag{width:72px;height:auto;border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,0.45);flex-shrink:0;display:block}
  .t-identity{flex:1;min-width:0}
  .t-name{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px;line-height:1}
  .t-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:2px}
  .t-owner{display:inline-flex;align-items:center;margin-top:5px;background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.25);border-radius:5px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--gold)}

<script>
// ── Auth helpers ──────────────────────────────────────────────────────────────
function getSession()        { try { return JSON.parse(localStorage.getItem('wc2026_session')); } catch { return null; } }
function clearSession()      { localStorage.removeItem('wc2026_session'); }

// ── Static WC2026 data (schedule never changes) ──────────────────────────────
const GROUP_INFO = {
  A:{teams:["Mexico","South Korea","South Africa","Czechia"],dates:"11–24 Jun"},
  B:{teams:["Canada","Switzerland","Qatar","Bosnia & Herz."],dates:"12–24 Jun"},
  C:{teams:["Brazil","Morocco","Scotland","Haiti"],dates:"12–25 Jun"},
  D:{teams:["United States","Australia","Paraguay","Türkiye"],dates:"12–25 Jun"},
  E:{teams:["Germany","Ivory Coast","Ecuador","Curaçao"],dates:"13–25 Jun"},
  F:{teams:["Netherlands","Japan","Sweden","Tunisia"],dates:"13–26 Jun"},
  G:{teams:["Belgium","Egypt","Iran","New Zealand"],dates:"15–26 Jun"},
  H:{teams:["Spain","Cape Verde","Saudi Arabia","Uruguay"],dates:"15–26 Jun"},
  I:{teams:["France","Senegal","Iraq","Norway"],dates:"16–26 Jun"},
  J:{teams:["Argentina","Algeria","Austria","Jordan"],dates:"16–27 Jun"},
  K:{teams:["Portugal","DR Congo","Uzbekistan","Colombia"],dates:"17–27 Jun"},
  L:{teams:["England","Croatia","Ghana","Panama"],dates:"17–27 Jun"},
};
const TM = {
  "Mexico":{t:2},"South Korea":{t:3},"South Africa":{t:4},"Czechia":{t:3},
  "Canada":{t:3},"Switzerland":{t:3},"Qatar":{t:4},"Bosnia & Herz.":{t:4},
  "Brazil":{t:1},"Morocco":{t:2},"Scotland":{t:3},"Haiti":{t:4},
  "United States":{t:2},"Australia":{t:3},"Paraguay":{t:3},"Türkiye":{t:3},
  "Germany":{t:1},"Ivory Coast":{t:3},"Ecuador":{t:3},"Curaçao":{t:4},
  "Netherlands":{t:1},"Japan":{t:2},"Sweden":{t:3},"Tunisia":{t:4},
  "Belgium":{t:2},"Egypt":{t:3},"Iran":{t:4},"New Zealand":{t:4},
  "Spain":{t:1},"Cape Verde":{t:4},"Saudi Arabia":{t:4},"Uruguay":{t:2},
  "France":{t:1},"Senegal":{t:2},"Iraq":{t:4},"Norway":{t:3},
  "Argentina":{t:1},"Algeria":{t:3},"Austria":{t:3},"Jordan":{t:4},
  "Portugal":{t:1},"DR Congo":{t:4},"Uzbekistan":{t:4},"Colombia":{t:2},
  "England":{t:1},"Croatia":{t:2},"Ghana":{t:3},"Panama":{t:4},
};
const RD_LABELS = ["Round of 32","Round of 16","Quarter-Finals","Semi-Finals"];
const RD_DATES  = ["28 Jun–3 Jul","4–7 Jul","9–11 Jul","14–15 Jul"];

const R32_MATCHES = [
  ["R32-1","L",[1,"A"],[2,"B"]],["R32-2","L",[1,"C"],[2,"D"]],
  ["R32-3","L",[1,"B"],[2,"A"]],["R32-4","L",[1,"D"],[2,"C"]],
  ["R32-5","L",[1,"E"],[2,"F"]],["R32-6","L",[1,"G"],[2,"H"]],
  ["R32-7","L",[1,"F"],[2,"E"]],["R32-8","L",[1,"H"],[2,"G"]],
  ["R32-9","R",[1,"I"],[2,"J"]],["R32-10","R",[1,"K"],[2,"L"]],
  ["R32-11","R",[1,"J"],[2,"I"]],["R32-12","R",[1,"L"],[2,"K"]],
  ["R32-13","R",[2,"I"],[2,"K"]],["R32-14","R",[2,"J"],[2,"L"]],
  ["R32-15","R",[1,"I"],[2,"L"]],["R32-16","R",[1,"K"],[2,"J"]],
];

// ── Live data (from Supabase) ────────────────────────────────────────────────
let ownerMap          = {};
let avatarMap         = {};
let results           = {};
let knockoutMap       = {};
let groupStandings    = {};
let totalParticipants = 0;

function groupMatches(g) {
  const t = GROUP_INFO[g].teams;
  return [
    {id:`${g}M1`,t1:t[0],t2:t[1]},{id:`${g}M2`,t1:t[0],t2:t[2]},
    {id:`${g}M3`,t1:t[0],t2:t[3]},{id:`${g}M4`,t1:t[1],t2:t[2]},
    {id:`${g}M5`,t1:t[1],t2:t[3]},{id:`${g}M6`,t1:t[2],t2:t[3]},
  ];
}

function computeStandings() {
  groupStandings = {};
  Object.keys(GROUP_INFO).forEach(g => {
    const stats = {};
    GROUP_INFO[g].teams.forEach(t => { stats[t] = {pts:0, gd:0, gf:0}; });
    groupMatches(g).forEach(m => {
      const r = results[m.id];
      if (!r || !r.played) return;
      const s1=+r.score1, s2=+r.score2;
      stats[m.t1].gf += s1; stats[m.t1].gd += (s1-s2);
      stats[m.t2].gf += s2; stats[m.t2].gd += (s2-s1);
      if (s1>s2)      { stats[m.t1].pts+=3; }
      else if (s2>s1) { stats[m.t2].pts+=3; }
      else            { stats[m.t1].pts+=1; stats[m.t2].pts+=1; }
    });
    groupStandings[g] = GROUP_INFO[g].teams
      .map(t => ({team:t, ...stats[t]}))
      .sort((a,b) => (b.pts-a.pts)||(b.gd-a.gd)||(b.gf-a.gf)||a.team.localeCompare(b.team));
  });
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  await loadData();
  setupNav();
  renderGroups();
  renderResults();
  renderBracket();
  renderLeaderboard();
  subscribeToUpdates();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
})();

async function loadData() {
  const [drawsRes, groupRes, knockoutRes, profilesRes] = await Promise.all([
    db.from('draws').select('team_name, profiles(first_name, last_name, avatar_url)'),
    db.from('group_results').select('*'),
    db.from('knockout_results').select('*'),
    db.from('profiles').select('id', { count: 'exact', head: true }),
  ]);
  totalParticipants = profilesRes.count || 0;

  ownerMap = {}; avatarMap = {};
  (drawsRes.data || []).forEach(d => {
    if (d.profiles) {
      ownerMap[d.team_name]  = d.profiles.first_name;
      avatarMap[d.team_name] = d.profiles.avatar_url || null;
    }
  });

  results = {};
  (groupRes.data || []).forEach(r => { results[r.match_id] = r; });

  knockoutMap = {};
  (knockoutRes.data || []).forEach(r => { knockoutMap[r.match_id] = r; });

  computeStandings();
}

async function setupNav() {
  const session = getSession();
  const nav = document.getElementById('hdrNav');
  if (!session) {
    nav.innerHTML = `<a href="login.html" class="btn-sm gold">Sign In</a>`;
    return;
  }
  const { data: settings } = await db.from('draw_settings').select('draw_open').single();
  const hasDraws = (session.draws_used < session.draws_allowed) && settings?.draw_open;
  nav.innerHTML = `

function subscribeToUpdates() {
  db.channel('tracker_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'group_results'},   () => reload())
    .on('postgres_changes',{event:'*',schema:'public',table:'knockout_results'},() => reload())
    .on('postgres_changes',{event:'*',schema:'public',table:'draws'},           () => reload())
    .subscribe();
}

async function reload() {
  await loadData();
  const active = document.querySelector('.tab.on');
  if (!active) return;
  const tab = active.getAttribute('onclick').match(/'(\w+)'/)[1];
  if (tab==='groups')      renderGroups();
  if (tab==='results')     renderResults();
  if (tab==='bracket')     renderBracket();
  if (tab==='leaderboard') renderLeaderboard();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function switchTab(id, btn) {
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('pane-'+id).classList.add('on');

}

// ── Sort helpers ──────────────────────────────────────────────────────────────
const MONTH_NUM = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};

function parseDateSort(str) {
  if (!str) return 99999;
  const [day, mon] = str.trim().split(' ');
  return (MONTH_NUM[mon] || 0) * 100 + (parseInt(day) || 0);
}

function parseTimeSort(str) {
  if (!str) return 9999;
  const m = str.match(/(\d+):(\d+)\s*(am|pm)/i);
  if (!m) return 9999;
  let h = parseInt(m[1]), mins = parseInt(m[2]);
  if (m[3].toLowerCase() === 'pm' && h !== 12) h += 12;
  if (m[3].toLowerCase() === 'am' && h === 12) h = 0;
  return h * 60 + mins;
}

function sortedGroupMatches(g) {
  return [...groupMatches(g)].sort((a, b) => {
    const ra = results[a.id] || {}, rb = results[b.id] || {};
    const dd = parseDateSort(ra.match_date) - parseDateSort(rb.match_date);
    return dd !== 0 ? dd : parseTimeSort(ra.kick_off_aest) - parseTimeSort(rb.kick_off_aest);
  });
}

function fxCard(t1,t2,r) {
  r=r||{};
  const played=r.played||false, s1=r.score1??null, s2=r.score2??null;
  const t1w=played&&+s1>+s2, t2w=played&&+s2>+s1;
  const tbd1=t1==='TBD', tbd2=t2==='TBD';
  const dt    = [r.match_date, r.kick_off_aest ? r.kick_off_aest+' AEST' : ''].filter(Boolean).join(' · ');
  const venue = r.venue || '';
  const hasSchedule = dt || venue;
  const team=(name,owner,win,tbd)=>`<div class="fx-team">
    ${tbd ? '<div class="fx-flag-blank"></div>' : flagImg(name)}
    <span class="fx-name${win?' win':''}${tbd?' tbd':''}">${name}</span>
    ${owner&&!tbd?`<span class="fx-owner">▸ ${owner}</span>`:''}
  </div>`;
  const midContent = played
    ? `<div class="fx-scores"><span class="fx-s${t1w?' win':''}">${s1}</span><span class="fx-sep">–</span><span class="fx-s${t2w?' win':''}">${s2}</span></div>
       ${dt?`<div class="fx-datetime">${dt}</div>`:''}
       ${venue?`<div class="fx-sched-venue">${venue}</div>`:''}
       <div class="fx-status">Full Time</div>`
    : hasSchedule
      ? `${dt?`<div class="fx-sched-dt">${dt}</div>`:''}
         ${venue?`<div class="fx-sched-venue">${venue}</div>`:''}
         <div class="fx-status" style="margin-top:6px">Upcoming</div>`
      : `<div class="fx-vs">VS</div><div class="fx-status">Upcoming</div>`;
  return `<div class="fx-card${played?' played':''}">
    ${team(t1,ownerMap[t1]||'',t1w,tbd1)}
    <div class="fx-mid">${midContent}</div>
    ${team(t2,ownerMap[t2]||'',t2w,tbd2)}
  </div>`;
}

// ── Bracket tab ───────────────────────────────────────────────────────────────
function resolveSlot(pos,grp){
  const st=groupStandings[grp];
  if(!st) return null;
  const allP=groupMatches(grp).every(m=>results[m.id]&&results[m.id].played);
  if(!allP) return null;
  return st[pos-1]?st[pos-1].team:null;
}
function mkT(name,matchId){return{name:name||'TBD',owner:name?(ownerMap[name]||null):null,winner:false,elim:false,id:name||'tbd',matchId:matchId||''};}
function buildHalf(side){
  const sm=R32_MATCHES.filter(m=>m[1]===side);
  const r32=sm.map(([mid,,sA,sB])=>{
    const tA=mkT(resolveSlot(sA[0],sA[1]),mid),tB=mkT(resolveSlot(sB[0],sB[1]),mid);
    const ko=knockoutMap[mid];
    if(ko&&ko.played){tA.winner=tA.name===ko.winner;tA.elim=tA.name===ko.loser;tB.winner=tB.name===ko.winner;tB.elim=tB.name===ko.loser;}
    return[tA,tB];
  });
  const rounds=[r32];
  const r16Ids=side==='L'?['R16-1','R16-2','R16-3','R16-4']:['R16-5','R16-6','R16-7','R16-8'];
  const qfIds=side==='L'?['QF-1','QF-2']:['QF-3','QF-4'];
  const sfIds=side==='L'?['SF-1']:['SF-2'];
  const roundIds=[r16Ids,qfIds,sfIds];
  for(let r=0;r<3;r++){
    const prev=rounds[r],next=[];
    for(let mi=0;mi<prev.length/2;mi++){
      const mid=roundIds[r][mi],mA=prev[mi*2],mB=prev[mi*2+1];
      const winA=mA.find(t=>t.winner)||null,winB=mB.find(t=>t.winner)||null;
      const tA=winA?{...winA,winner:false,elim:false,matchId:mid}:mkT(null,mid);
      const tB=winB?{...winB,winner:false,elim:false,matchId:mid}:mkT(null,mid);
      const ko=knockoutMap[mid];
      if(ko&&ko.played){tA.winner=tA.name===ko.winner;tA.elim=tA.name===ko.loser;tB.winner=tB.name===ko.winner;tB.elim=tB.name===ko.loser;}
      next.push([tA,tB]);
    }
    rounds.push(next);
  }
  return rounds;
}
function pill(t){
  const isTbd=t.id==='tbd';
  const cls=isTbd?'tbd':(t.winner?'winner':(t.elim?'elim':''));
  return `<div class="mpill ${cls}"><div><div class="mname">${t.name}</div>${t.owner&&!isTbd?`<div class="mowner">▸ ${t.owner}</div>`:''}</div></div>`;
}
function mBlock(match){
  const[t1,t2]=match,mid=t1.matchId||t2.matchId||'';
  return`<div class="match-block">${mid?`<div class="match-id-label">${mid}</div>`:''}${pill(t1)}<div class="mvs">vs</div>${pill(t2)}</div>`;
}
function fPill(team){
  const isTbd=!team||team.id==='tbd'||team.name==='TBD';
  return`<div class="fin-pill${isTbd?' tbd':''}"><div><div class="fname">${team?team.name:'TBD'}</div>${team&&team.owner&&!isTbd?`<div class="fowner">▸ ${team.owner}</div>`:''}</div></div>`;
}
function renderBracket(){

  const hint=groupsDone===12?'Group stage complete — bracket auto-populated':`Group stage in progress (${groupsDone}/12 groups) — bracket fills as results are entered`;
  const L=buildHalf('L'),R=buildHalf('R');

      <div class="prize-card p3"><div class="prize-pos p3">🥉 3rd Place</div><div class="prize-amt p3">$70</div></div>

  <div class="bracket-scroll"><div class="bracket-layout" id="bl">`;
  for(let r=0;r<4;r++){if(r>0)html+=`<div class="b-gap"></div>`;html+=`<div class="b-col"><div class="b-col-hd">${RD_LABELS[r]}<span class="rd">${RD_DATES[r]}</span></div><div class="b-matches">`;L[r].forEach(m=>{html+=mBlock(m);});html+=`</div></div>`;}
  const sfL=L[3][0],sfR=R[3][0],tbdF={name:'TBD',owner:null,id:'tbd'};

  html+=`<div class="b-gap"></div><div class="b-center">
    <div class="fin-lbl">🏆 Final</div><div class="fin-date">19 July · MetLife Stadium</div>
    ${fPill(finL)}<div class="fin-vs">VS</div>${fPill(finR)}
    ${champ?`<div style="text-align:center;margin-top:12px"><div class="champ-lbl" style="margin-bottom:8px">🌟 World Champions</div><div class="fin-pill champion"><div><div class="fname">${champ.name}</div>${champ.owner?`<div class="fowner">▸ ${champ.owner}</div>`:''}</div></div></div>`:''}
  </div><div class="b-gap"></div>`;
  for(let r=3;r>=0;r--){if(r<3)html+=`<div class="b-gap"></div>`;html+=`<div class="b-col"><div class="b-col-hd">${RD_LABELS[r]}<span class="rd">${RD_DATES[r]}</span></div><div class="b-matches">`;R[r].forEach(m=>{html+=mBlock(m);});html+=`</div></div>`;}
  html+=`</div></div>`;

// ── Bobblehead helper ─────────────────────────────────────────────────────────
function makeBobblehead(teamName, ownerName, eliminated) {
  const avatar    = avatarMap[teamName];
  const flagVal   = FLAG_CODES[teamName];
  const flagSrc   = flagVal ? (flagVal.startsWith('http') ? flagVal : `https://flagcdn.com/w80/${flagVal}.png`) : null;
  const firstName = ownerName || '?';
  const initial   = ownerName ? ownerName.charAt(0).toUpperCase() : '?';
  // Deterministic stagger so each bobblehead is slightly out of phase
  const delay = ((teamName.charCodeAt(0) + teamName.charCodeAt(teamName.length - 1)) % 10) * 0.28;
  return `<div class="bh-card${eliminated ? ' bh-elim' : ''}">
    <div class="bh-head-wrap" style="animation-delay:${delay}s">
      ${avatar
        ? `<img src="${avatar}" class="bh-face" alt="${firstName}">`
        : `<div class="bh-initial">${initial}</div>`}
    </div>
    <div class="bh-neck"></div>
    <div class="bh-shirt${flagSrc ? '' : ' bh-shirt-blank'}"${flagSrc ? ` style="background-image:url('${flagSrc}')"` : ''}></div>
    <div class="bh-name">${firstName}</div>
    <div class="bh-team">${teamName}</div>
  </div>`;
}

// ── Who's Left tab ────────────────────────────────────────────────────────────
function renderLeaderboard(){
  const eliminated=new Set();
  const champ=(()=>{const f=Object.values(knockoutMap).find(k=>k.match_id==='FINAL'&&k.played);return f?f.winner:null;})();
  Object.values(knockoutMap).forEach(k=>{if(k.played&&k.loser)eliminated.add(k.loser);});
  Object.keys(GROUP_INFO).forEach(g=>{
    if(!groupMatches(g).every(m=>results[m.id]&&results[m.id].played))return;
    (groupStandings[g]||[]).forEach((s,i)=>{if(i>=2)eliminated.add(s.team);});
  });
  function teamStatus(team){
    if(champ&&team===champ)return{label:'🏆 CHAMPION',cls:'in'};
    if(eliminated.has(team)){
      const k=Object.values(knockoutMap).find(k=>k.played&&k.loser===team);
      if(k){const map={R32:'Lost in R32',R16:'Lost in R16',QF:'Lost in QF',SF:'Lost in SF',FINAL:'Runner-up'};return{label:map[k.match_id.replace(/-.*$/,'')]||'Eliminated',cls:'out'};}
      return{label:'Out (group stage)',cls:'out'};
    }
    let furthest='Group stage';
    Object.values(knockoutMap).forEach(k=>{
      if(!k.played||k.winner!==team)return;
      const map={R32:'Into R16',R16:'Into QF',QF:'Into SF',SF:'Into Final',FINAL:'Champion'};
      furthest=map[k.match_id.replace(/-.*$/,'')]||furthest;
    });
    return{label:furthest,cls:'in'};
  }
  const drawnTeams=Object.entries(ownerMap);
  const inR=[],outR=[];
  drawnTeams.forEach(([team,person])=>{
    const st=teamStatus(team);
    (st.cls==='out'?outR:inR).push({team,person,status:st.label});
  });
  const ro={'Champion':6,'Into Final':5,'Into SF':4,'Into QF':3,'Into R16':2,'Group stage':1};
  inR.sort((a,b)=>(ro[b.status]||0)-(ro[a.status]||0)||a.person.localeCompare(b.person));
  outR.sort((a,b)=>a.person.localeCompare(b.person));
  const rowHTML=(r,alive)=>{
    const av = avatarMap[r.team];
    return `<div class="status-row ${alive?'alive':'dead'}">
      ${av
        ? `<img src="${av}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid ${alive?'rgba(29,184,122,0.4)':'rgba(255,80,80,0.25)'}">`
        : `<div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.06);flex-shrink:0;border:2px solid rgba(255,255,255,0.08)"></div>`}
      <div style="flex:1;min-width:0">
        <div class="sr-team">${r.team}</div>
        <div class="sr-person">▸ ${r.person}</div>
      </div>
      <div class="sr-status ${alive?'in':'out'}">${r.status}</div>
    </div>`;
  };
  // Bobblehead gallery
  const allDrawn = Object.entries(ownerMap).sort((a,b)=>a[1].localeCompare(b[1])||a[0].localeCompare(b[0]));
  const bhIn  = allDrawn.filter(([t])=>!eliminated.has(t));
  const bhOut = allDrawn.filter(([t])=> eliminated.has(t));
  const bhHtml = allDrawn.length ? `<div class="bh-section">

async function renderTrade() {
  const el = document.getElementById('trade-inner');
  if (!el) return;
  const session = getSession();

  // Close expired auctions server-side
  try { await db.rpc('close_expired_auctions'); } catch(e){}

  // Fetch auctions with seller + winner profiles
  const { data: auctions } = await db.from('auctions')
    .select(`id, team_name, seller_id, min_bid, closes_at, status, winner_id, winning_bid, created_at,
             seller:profiles!seller_id(first_name, last_name, avatar_url),
             winner:profiles!winner_id(first_name, last_name, avatar_url)`)
    .order('status').order('closes_at');

  const all = auctions || [];
  const aIds = all.map(a => a.id);

  // Fetch bid summaries
  let bidMap = {};
  if (aIds.length) {
    const { data: bids } = await db.from('bids').select('auction_id, amount').in('auction_id', aIds);
    (bids || []).forEach(b => {
      if (!bidMap[b.auction_id]) bidMap[b.auction_id] = { count: 0, highest: 0 };
      bidMap[b.auction_id].count++;
      if (b.amount > bidMap[b.auction_id].highest) bidMap[b.auction_id].highest = +b.amount;
    });
  }

  // My available teams to list
  let myListable = [];
  if (session) {
    const { data: myDraws } = await db.from('draws').select('team_name').eq('user_id', session.id);
    const activeListed = new Set(all.filter(a => a.status === 'active').map(a => a.team_name));
    myListable = (myDraws || []).map(d => d.team_name).filter(t => !activeListed.has(t));
  }

  const active = all.filter(a => a.status === 'active');
  const closed = all.filter(a => a.status === 'closed').slice(0, 12);

  const fmtDate = iso => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'}) +
           ' · ' + d.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', timeZone:'Australia/Sydney'}) + ' AEST';
  };

  el.innerHTML =
    (session ? tradeListForm(myListable, session) : `<div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted);padding:12px 0 20px">Sign in to bid or list a team.</div>`) +
    (active.length
      ? `<div class="trade-sec-lbl">🔴 Live Auctions <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);letter-spacing:0">(${active.length})</span></div>
         <div class="auction-grid">${active.map(a => tradeCard(a, bidMap[a.id]||{count:0,highest:0}, session, fmtDate)).join('')}</div>`
      : `<div class="trade-empty">No live auctions right now — list a team above to get one started.</div>`) +
    (closed.length
      ? `<div class="trade-sec-lbl" style="margin-top:24px">Closed Auctions</div>
         <div class="auction-grid">${closed.map(a => tradeCard(a, bidMap[a.id]||{count:0,highest:0}, session, fmtDate)).join('')}</div>`
      : '');

  // Start countdown timers
  if (tradeTimer) clearInterval(tradeTimer);
  tradeTimer = setInterval(() => {
    document.querySelectorAll('[data-closes]').forEach(el => {
      const diff = new Date(el.dataset.closes) - new Date();
      if (diff <= 0) { el.textContent = 'CLOSED'; el.className = 'ac-cd-time'; return; }
      const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.className = 'ac-cd-time' + (diff < 300000 ? ' urgent' : '');
    });
  }, 1000);
}

function tradeCard(a, bids, session, fmtDate) {
  const isLive  = a.status === 'active';
  const isMine  = session && a.seller_id === session.id;
  const fv      = FLAG_CODES[a.team_name];
  const fs      = fv ? (fv.startsWith('http') ? fv : `https://flagcdn.com/w80/${fv}.png`) : null;
  const tierCls = TM[a.team_name] ? 't'+TM[a.team_name].t : '';
  const sName   = a.seller ? a.seller.first_name+' '+a.seller.last_name : 'Unknown';
  const curBid  = bids.highest || 0;
  const minNext = Math.max(+a.min_bid, curBid + 1).toFixed(0);
  const group   = Object.entries(GROUP_INFO).find(([,g]) => g.teams.includes(a.team_name))?.[0] || '?';

  const badge = isLive
    ? `<span class="ac-badge badge-live">🔴 Live</span>`
    : (a.winner_id ? `<span class="ac-badge badge-sold">✓ Sold</span>` : `<span class="ac-badge badge-closed">No Bids</span>`);

  const cancelBtn = (isLive && session?.is_admin)
    ? `<button onclick="cancelAuction('${a.id}')" style="margin-left:auto;background:transparent;border:1px solid rgba(255,80,80,0.3);color:rgba(255,100,100,0.7);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:6px;cursor:pointer" onmouseover="this.style.borderColor='rgba(255,80,80,0.7)';this.style.color='#ff9090'" onmouseout="this.style.borderColor='rgba(255,80,80,0.3)';this.style.color='rgba(255,100,100,0.7)'">✕ Cancel Auction</button>`
    : '';
  const footer = isLive
    ? (isMine
        ? `<div class="ac-foot"><div class="ac-my-listing">This is your listing — bids are anonymous until it closes.</div>${cancelBtn}</div>`
        : session
          ? `<div class="ac-foot">
               <input class="ac-bid-input" id="bid-${a.id}" type="number" min="${minNext}" placeholder="$${minNext}">
               <button class="ac-bid-btn" onclick="placeBid('${a.id}')">PLACE BID</button>
               <div class="ac-min-note">Minimum $${minNext} · Bids anonymous until close</div>
               ${cancelBtn}
             </div>`
          : `<div class="ac-foot"><div class="ac-my-listing">Sign in to place a bid.</div>${cancelBtn}</div>`)
    : (a.winner_id
        ? `<div class="ac-winner-row">
             ${miniBobbHead(a.winner.first_name+' '+a.winner.last_name, a.winner.avatar_url, a.team_name)}
             <div>
               <div class="ac-winner-lbl">🏆 Won by</div>
               <div class="ac-winner-name">${a.winner.first_name} ${a.winner.last_name}</div>
             </div>
             <div class="ac-winner-amt">$${(+a.winning_bid).toFixed(2)}</div>
           </div>`
        : `<div class="ac-no-bids">Auction closed with no bids — team returned to owner.</div>`);

  return `<div class="ac ${isLive?'live':'closed'}">
    <div class="ac-hdr">
      ${fs ? `<img src="${fs}" class="ac-flag" alt="${a.team_name}">` : ''}
      <div class="ac-ti">
        <div class="ac-tn">${a.team_name}</div>
        <div class="ac-tm">Group ${group}</div>
      </div>
      ${badge}
    </div>
    <div class="ac-seller">
      ${miniBobbHead(sName, a.seller?.avatar_url, a.team_name)}
      <div class="ac-seller-info">
        <strong>${a.seller?.first_name || 'Unknown'}</strong> is selling
        <span class="ac-opening">Opening bid: $${(+a.min_bid).toFixed(2)}</span>
      </div>
    </div>
    <div class="ac-body">
      <div class="ac-bid-block">
        <div class="ac-bid-lbl">${isLive ? 'Current Bid' : 'Final Bid'}</div>
        <div class="ac-bid-amt">${curBid > 0 ? '$'+curBid.toFixed(0) : '$—'}</div>
        <div class="ac-bid-cnt">${bids.count} bid${bids.count!==1?'s':''} · ${isLive?'bidders anonymous until close':'auction closed'}</div>
      </div>
      <div class="ac-cd">
        ${isLive
          ? `<div class="ac-cd-time" data-closes="${a.closes_at}">--:--:--</div>
             <div class="ac-cd-sub">Time left</div>
             <div class="ac-cd-date">${fmtDate(a.closes_at)}</div>`
          : `<div class="ac-cd-time" style="font-size:17px;color:var(--muted)">CLOSED</div>
             <div class="ac-cd-date" style="margin-top:6px">${fmtDate(a.closes_at)}</div>`}
      </div>
    </div>
    ${footer}
  </div>`;
}

async function submitListTeam() {
  const team   = document.getElementById('tl-team')?.value;
  const minBid = parseFloat(document.getElementById('tl-min')?.value);
  const date   = document.getElementById('tl-date')?.value;
  const time   = document.getElementById('tl-time')?.value;
  if (!team)             { alert('Please select a team.'); return; }
  if (!minBid || minBid < 1) { alert('Please enter a minimum bid of at least $1.'); return; }
  if (!date || !time)    { alert('Please set a close date and time.'); return; }
  const closesAt = new Date(`${date}T${time}:00+10:00`);
  if (closesAt <= new Date()) { alert('Close time must be in the future.'); return; }
  const session = getSession();
  if (!session) return;
  const { error } = await db.from('auctions').insert({
    team_name: team, seller_id: session.id, min_bid: minBid, closes_at: closesAt.toISOString()
  });
  if (error) { alert('Error: ' + error.message); return; }
  renderTrade();
}

async function cancelAuction(auctionId) {
  if (!confirm('Cancel this auction?\n\nAll bids will be removed and the team stays with its current owner.')) return;
  const { error } = await db.from('auctions').delete().eq('id', auctionId);
  if (error) { alert('Error: ' + error.message); return; }
  renderTrade();
}

async function placeBid(auctionId) {
  const session = getSession();
  if (!session) { alert('Please sign in to bid.'); return; }
  const input  = document.getElementById('bid-' + auctionId);
  const amount = parseFloat(input?.value);
  if (!amount || amount <= 0) { alert('Please enter a bid amount.'); return; }
  const { error } = await db.rpc('place_bid', { p_auction_id: auctionId, p_bidder_id: session.id, p_amount: amount });
  if (error) {
    const msgs = { auction_closed:'This auction has closed.', auction_expired:'This auction just closed.',
      cannot_bid_own:"You can't bid on your own team!", below_minimum:'Your bid is below the minimum.',
      bid_too_low:'Your bid must be higher than the current bid.' };
    alert(msgs[error.message] || 'Error: ' + error.message);
    return;
  }
  renderTrade();
}

function renderTeams() {
  const el = document.getElementById('teams-inner');
  if (!el) return;
  const filtered = TEAMS_DATA
    .filter(t => !teamsTier || t.tier === teamsTier)
    .filter(t => !teamsQuery || t.name.toLowerCase().includes(teamsQuery));
  const pills =[[0,'All'],[1,'⭐ Favourites'],[2,'Contenders'],[3,'Dark Horses'],[4,'Outsiders']]
    .map(([v,l]) => `<button class="t-pill${teamsTier===v?' on':''}" onclick="setTeamsTier(${v})">${l}</button>`).join('');
  el.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
      <input class="t-search" type="text" placeholder="Search team…" oninput="teamsQuery=this.value.toLowerCase();renderTeams()" value="${teamsQuery}">
      <div style="display:flex;gap:6px;flex-wrap:wrap">${pills}</div>
    </div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);margin-bottom:16px;letter-spacing:0.5px">${filtered.length} team${filtered.length!==1?'s':''} · Odds are pre-tournament estimates in Australian dollars</div>
    <div class="t-grid">${filtered.map(teamCard).join('')}</div>`;
}

function teamCard(t) {
  const owner   = ownerMap[t.name] || null;
  const avatar  = avatarMap[t.name] || null;
  const flagSrc = t.flag.startsWith('http') ? t.flag : `https://flagcdn.com/w80/${t.flag}.png`;
  const initial = owner ? owner.charAt(0).toUpperCase() : '?';
  const firstName = owner ? owner.split(' ')[0] : '';
  const yearCell = t.titles > 0
    ? t.titleYears.reduce((acc,y,i) => {
        const chunk = i % 3 === 0 ? '<span class="t-years won">' : '';
        const end   = (i+1) % 3 === 0 || i === t.titleYears.length-1 ? '</span>' : ' · ';
        return acc + chunk + y + end;
      }, '')
    : t.bestYear ? `<span class="t-years none">${t.bestYear}</span>` : `<span class="t-sv dim">—</span>`;
  const yearLabel = t.titles > 0 ? (t.titleYears.length > 1 ? 'Title Years' : 'Title Year') : 'Best Year';
  const bfSize   = t.bestFinish.length > 9 ? 'font-size:13px' : 'font-size:17px';
  return `<div class="t-card t${t.tier}">
    <div class="t-main">
      <img src="${flagSrc}" class="t-flag" alt="${t.name}">
      <div class="t-identity">
        <div class="t-name">${t.name}</div>
        <div class="t-sub">Group ${t.group} · ${TIER_LABELS[t.tier]}</div>
        ${owner ? `<div class="t-owner">▸ ${owner}</div>` : '<div class="t-undrawn">Not yet drawn</div>'}
      </div>
      <div class="t-avatar">
        ${avatar ? `<img src="${avatar}" class="t-av-img" alt="${owner}">` : `<div class="t-av-ph">${initial}</div>`}
        ${owner ? `<div class="t-av-name">${firstName}</div>` : ''}
      </div>
      <div class="t-odds">
        <span class="t-odds-val">${t.odds}</span>
        <span class="t-odds-lbl">Win odds</span>
      </div>
    </div>
    <div class="t-stats">
      <div class="t-stat"><span class="t-sv">${t.appearances}</span><span class="t-sl">Appearances</span></div>
      <div class="t-stat"><span class="t-sv${t.titles > 0 ? ' gold' : ' dim'}">${t.titles > 0 ? t.titles+'×' : '—'}</span><span class="t-sl">Champions</span></div>
      <div class="t-stat"><span class="t-sv" style="${bfSize}">${t.bestFinish}</span><span class="t-sl">Best Finish</span></div>
      <div class="t-stat">${yearCell}<span class="t-sl">${yearLabel}</span></div>
    </div>
    <div class="t-fact">"${t.fact}"</div>
  </div>`;
}
